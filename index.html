<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Kings – Contact Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0A0A0A 0%, #1A1A1A 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            padding: 1.5rem;
        }

        .contact-card {
            max-width: 450px;
            width: 100%;
            background: #0A0A0A;
            border-radius: 32px;
            border: 1px solid rgba(212,175,55,0.3);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .contact-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(212,175,55,0.15);
            border-color: rgba(212,175,55,0.6);
        }

        /* Brand header */
        .card-header {
            background: linear-gradient(135deg, #1A1A1A 0%, #0A0A0A 100%);
            padding: 1.8rem 1.8rem 1rem;
            text-align: center;
            border-bottom: 1px solid rgba(212,175,55,0.2);
        }

        .logo-icon {
            font-size: 3rem;
            color: #D4AF37;
            margin-bottom: 0.5rem;
        }

        .card-header h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            letter-spacing: 1px;
            color: #EAEAEA;
        }

        .card-header h2 span {
            color: #D4AF37;
        }

        .card-header p {
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: #D4AF37;
            text-transform: uppercase;
            margin-top: 0.2rem;
        }

        /* About section */
        .about-section {
            padding: 1.5rem 1.8rem;
            border-bottom: 1px solid rgba(212,175,55,0.15);
        }

        .about-section h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.3rem;
            margin-bottom: 0.8rem;
            color: #D4AF37;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .about-section h3 i {
            font-size: 1.1rem;
        }

        .about-section p {
            font-size: 0.9rem;
            line-height: 1.5;
            color: #CCCCCC;
        }

        /* Contact details */
        .contact-details {
            padding: 0.5rem 1.8rem;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.8rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .detail-item:last-child {
            border-bottom: none;
        }

        .detail-icon {
            width: 36px;
            height: 36px;
            background: rgba(212,175,55,0.12);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #D4AF37;
            font-size: 1.1rem;
            transition: 0.2s;
        }

        .detail-item a {
            color: #EAEAEA;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
            flex: 1;
            word-break: break-all;
        }

        .detail-item a:hover {
            color: #D4AF37;
        }

        .detail-item:hover .detail-icon {
            background: #D4AF37;
            color: #0A0A0A;
        }

        /* Social media row */
        .social-row {
            padding: 1.2rem 1.8rem 1.8rem;
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            flex-wrap: wrap;
            border-top: 1px solid rgba(212,175,55,0.15);
            margin-top: 0.5rem;
        }

        .social-link {
            width: 44px;
            height: 44px;
            background: rgba(212,175,55,0.08);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #EAEAEA;
            font-size: 1.3rem;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .social-link:hover {
            background: #D4AF37;
            color: #0A0A0A;
            transform: translateY(-3px);
        }

        /* Small footer note */
        .card-footer {
            background: rgba(0,0,0,0.4);
            padding: 0.8rem;
            text-align: center;
            font-size: 0.7rem;
            color: #777;
            border-top: 1px solid rgba(212,175,55,0.1);
        }

        .card-footer a {
            color: #D4AF37;
            text-decoration: none;
        }

        .card-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="contact-card">
        <!-- Header with logo icon -->
        <div class="card-header">
            <div class="logo-icon">
                <i class="fas fa-crown"></i>
            </div>
            <h2>CREATIVE <span>KINGS</span></h2>
            <p>FABRICATION</p>
        </div>

        <!-- Brief About Us -->
        <div class="about-section">
            <h3><i class="fas fa-info-circle"></i> About Us</h3>
            <p>Luxury staircase design, gate fabrication, glass & metal works. Transforming spaces across Nigeria with precision, innovation, and uncompromising quality.</p>
        </div>

        <!-- Contact details: email + website -->
        <div class="contact-details">
            <div class="detail-item">
                <div class="detail-icon"><i class="fas fa-envelope"></i></div>
                <a href="mailto:enquirycreativeking@gmail.com">enquirycreativeking@gmail.com</a>
            </div>
            <div class="detail-item">
                <div class="detail-icon"><i class="fas fa-globe"></i></div>
                <a href="https://www.creativekings.ng" target="_blank">www.creativekings.ng</a>
            </div>
        </div>

        <!-- Social Media Handles (clickable) -->
        <div class="social-row">
            <a href="https://www.instagram.com/creativekings.ng" class="social-link" target="_blank" aria-label="Instagram">
                <i class="fab fa-instagram"></i>
            </a>
            <a href="https://web.facebook.com/people/Creative-King-Fabrication/61584915017676/" class="social-link" target="_blank" aria-label="Facebook">
                <i class="fab fa-facebook-f"></i>
            </a>
            <a href="https://www.tiktok.com/@creative_kings_" class="social-link" target="_blank" aria-label="TikTok">
                <i class="fab fa-tiktok"></i>
            </a>
            <a href="https://x.com/creativekinghq" class="social-link" target="_blank" aria-label="X">
                <i class="fab fa-twitter"></i>
            </a>
        </div>

        <!-- Optional footer (built by) -->
        <div class="card-footer">
            Connect with us — <a href="#">Let's build something extraordinary</a>
        </div>
    </div>
</body>
</html>
